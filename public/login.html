<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Portal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon">⚡</div>
      <h1>Admin Portal</h1>
      <p>Sign in to manage students & courses</p>
    </div>

    <!-- Demo Credentials Helper Box -->
    <div class="demo-credentials" id="demo-creds" style="cursor: pointer;" title="Click to auto-fill credentials">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong>Default Credentials:</strong>
        <span style="font-size: 0.72rem; background: rgba(59, 130, 246, 0.15); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: 600;">Click to fill</span>
      </div>
      <div style="margin-top: 4px;">Email: <code>admin@example.com</code></div>
      <div>Password: <code>admin123</code></div>
    </div>

    <!-- Error Alert Box -->
    <div id="login-alert" class="alert alert-danger" role="alert">
      <span id="alert-icon">⚠️</span>
      <span id="alert-message">Invalid credentials</span>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="admin@example.com"
          required
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label class="form-checkbox-label">
          <input type="checkbox" id="show-password" class="form-checkbox" />
          <span>Show password</span>
        </label>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary btn-block">
        <span id="btn-text">Sign In to Dashboard</span>
        <span id="btn-spinner" style="display: none;">Authenticating...</span>
      </button>
    </form>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
