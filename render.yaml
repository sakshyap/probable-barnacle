# Render blueprint - static site build of the portfolio.
# Create the service with: New > Blueprint > select this repository.
services:
  - type: web
    name: sakshi-portfolio
    runtime: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # React Router routes and page refreshes fall back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html